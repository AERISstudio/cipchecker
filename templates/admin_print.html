<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀 데이터 출력</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        table, th, td {
            border: 1px solid black;
            text-align: center;
        }
        th, td {
            padding: 10px;
        }
        /* 인쇄 시 스타일 */
        @media print {
            button, select {
                display: none;
            }
        }
    </style>
</head>
<body>
    <h1>엑셀 데이터 출력</h1>
    

    <!-- 방별 데이터 출력 -->
    <div style="margin-top:20px;">
        <label for="roomSelect">방 선택:</label>
        <select id="roomSelect" onchange="loadRoomData()">
            <option value="자습실1">자습실1</option>
            <option value="자습실2">자습실2</option>
            <option value="자습실3">자습실3</option>
            <option value="자습실4">자습실4</option>
            <option value="자습실5">자습실5</option>
            <option value="활동실1">활동실1</option>
            <option value="활동실2">활동실2</option>
            <option value="활동실3">활동실3</option>
            <option value="수행실1">수행실1</option>
            <option value="수행실2">수행실2</option>
        </select>
        <button onclick="printPageRoom()">🖨 방 인쇄</button>
    </div>

    <div id="tableContainer" style="margin-top:20px;">
        <table id="excelTable">
            <thead>
                <tr>
                    <th>학번</th>
                    <th>이름</th>
                    <th>CIP2</th>
                    <th>CIP3</th>
                </tr>
            </thead>
            <tbody>
                <!-- 데이터가 동적으로 추가됨 -->
            </tbody>
        </table>
    </div>

    <script>
        // 반별 데이터 로드
        function loadExcelData() {
            let classNum = document.getElementById("classSelect").value;
            fetch(`/get_excel_data?class=${classNum}`)
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.querySelector("#excelTable tbody");
                    tableBody.innerHTML = "";
                    if (data.error) {
                        tableBody.innerHTML = `<tr><td colspan="4">${data.error}</td></tr>`;
                        return;
                    }
                    data.forEach(row => {
                        let tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${row.학번}</td>
                            <td>${row.이름}</td>
                            <td>${row.CIP2}</td>
                            <td>${row.CIP3}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                })
                .catch(error => console.error("반 데이터 불러오기 실패:", error));
        }
  
        // 방별 데이터 로드
        function loadRoomData() {
            let roomName = document.getElementById("roomSelect").value;
            fetch(`/get_room_data?room=${roomName}`)
                .then(response => response.json())
                .then(data => {
                    let tableBody = document.querySelector("#excelTable tbody");
                    tableBody.innerHTML = "";
                    if (data.error) {
                        tableBody.innerHTML = `<tr><td colspan="4">${data.error}</td></tr>`;
                        return;
                    }
                    data.forEach(row => {
                        let tr = document.createElement("tr");
                        tr.innerHTML = `
                            <td>${row.학번}</td>
                            <td>${row.이름}</td>
                            <td>${row.CIP2}</td>
                            <td>${row.CIP3}</td>
                        `;
                        tableBody.appendChild(tr);
                    });
                })
                .catch(error => console.error("방 데이터 불러오기 실패:", error));
        }

        function printPageClass() {
            loadExcelData();
            setTimeout(() => {
                window.print();
            }, 1000);
        }

        function printPageRoom() {
            loadRoomData();
            setTimeout(() => {
                window.print();
            }, 1000);
        }

        // 페이지 로드시 기본으로 10반 데이터를 로드합니다.
        document.addEventListener("DOMContentLoaded", loadExcelData);
    </script>
</body>
</html>
